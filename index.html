<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的NFC音乐页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;text-align:center;padding:40px}
.box{max-width:400px;margin:0 auto}
.cover{width:240px;height:240px;border-radius:16px;object-fit:cover;margin-bottom:20px}
audio{width:100%}
h2{margin-bottom:20px}
</style>
</head>
<body>
<div class="box">
  <img class="cover" src="cover.jpg" alt="封面">
  <h2>寻.华晨宇</h2>
  <audio controls loop>
    <source src="music.mp3" type="audio/mpeg">
    浏览器不支持音频
  
</div>
</body>
</html>
