<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>寻.华晨宇</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;
      background:#08080a;
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:100%;
      max-width:380px;
      background:linear-gradient(145deg,#16161b,#0c0c0f);
      border-radius:22px;
      padding:32px 24px;
      text-align:center;
      box-shadow:0 20px 60px rgba(180,30,50,0.18);
      border:1px solid rgba(255,255,255,0.07);
    }
    .cover{
      width:72%;
      aspect-ratio:1/1;
      border-radius:16px;
      object-fit:cover;
      margin:0 auto 24px;
      box-shadow:0 12px 30px rgba(160,20,40,0.25);
      cursor:pointer;
      transition: transform 0.2s ease;
    }
    .cover:active{
      transform: scale(0.97);
    }
    .title{
      font-size:24px;
      letter-spacing:4px;
      color:#f0f0f2;
      margin-bottom:8px;
    }
    .artist{
      font-size:14px;
      color:#999;
      margin-bottom:20px;
      letter-spacing:2px;
    }
    .tip{
      font-size:13px;
      color:#777;
    }
    audio{
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="cover" id="coverImg" src="cover.jpg" alt="封面">
    <div class="title">寻.华晨宇</div>
    <div class="artist">华晨宇</div>
    <div class="tip">点击封面 ▶ / ⏸</div>
    <audio id="audioPlayer" preload="auto">
      <source src="music.mp3" type="audio/mpeg">
    
  </div>

<script>
const audio = document.getElementById('audioPlayer');
const cover = document.getElementById('coverImg');

// 封面点击：播放暂停切换
cover.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
});

// 页面失去焦点、切后台、切换标签页 → 自动暂停
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    audio.pause();
  }
});

// 窗口关闭/刷新前暂停
window.addEventListener('beforeunload', () => {
  audio.pause();
});
</script>
</body>
</html>
